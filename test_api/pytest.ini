# See mypy.readthedocs.io/en/stable/config_file.html for more information

# 这是 mypy.ini 的固定头部，表示下面的配置都属于 pytest 框架
# 文件名改为pytest了，这里也改下。可能会遇到新问题？
[pytest]

# Specify additional search paths for Mypy
#mypy_path = stubs

# Increase strictness of checks
disallow_any_decorated = True
disallow_any_expr = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_defs = True
disallow_untyped_calls = True
strict_optional = True
warn_no_return = True

# Display statistics after running
#dump_type_stats = True
#dump_inference_stats = False

# Ignore errors in 'tests' directory
#[mypy-tests]
#ignore_errors = True


# 这里是配置文件，项目测试内容较多、且需要区分时用到。
# 写一些共享的内容，如按照测试类型不同可分为web、ui等


# 输出企业级测试报告用到的插件,存到temps文件夹、并清除之前的报告。每次执行 pytest 命令时，自动带上这些命令行参数
addopts = --alluredir=./temps   --clean-alluredir -s


log_cli = 0
log_file = ./logs/pytest.log
log_file_level = info
# 日志格式配置：级别、时间戳、日志器名称、打印日志的代码行号、真正的日志内容
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s
# 时间格式配置
log_file_date_format = %Y-%m-%d %H:%M:%S

# pytest 不允许同一个配置项出现两次，它会直接报错。要写到同一个配置项
# 每次运行框架，都打印内容
# addopts = -s
